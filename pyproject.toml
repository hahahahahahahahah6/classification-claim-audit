[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "classification-claim-audit"
version = "0.1.0"
description = "Offline audit of documented whole-picture labelling assertions"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}

[project.scripts]
classification-claim-audit = "classification_claim_audit.__main__:main"

[tool.setuptools.packages.find]
include = ["classification_claim_audit*"]
